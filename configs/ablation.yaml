# ID-format ablation configuration. See docs/PROJECT_STATE.md, "Next task: the
# ID-format ablation". No annotation is produced from this config -- it exists
# to isolate whether the 36.3% citation-resolution failure measured under
# composite ids (configs/pilot.yaml, id_style=composite, Qwen2.5-3B-Instruct)
# collapses under ordinal ids, and whether model size changes the answer.
#
# Retrieval is IDENTICAL to the registered pilot -- only generation.id_style and
# generation.model vary across the four cells of the ablation table. Override
# both, plus --run-name so the four runs get separate output directories and
# generation caches (see scripts/_common.py paths()):
#
#   # cell already done under configs/pilot.yaml: 3B x composite -> 36.3% failure
#   python scripts/02_run_rag.py --config configs/ablation.yaml \
#       --model Qwen/Qwen2.5-3B-Instruct --id-style ordinal \
#       --run-name ablation_3b_ordinal
#   python scripts/02_run_rag.py --config configs/ablation.yaml \
#       --model Qwen/Qwen2.5-7B-Instruct-AWQ --id-style composite \
#       --run-name ablation_7b_composite
#   python scripts/02_run_rag.py --config configs/ablation.yaml \
#       --model Qwen/Qwen2.5-7B-Instruct-AWQ --id-style ordinal \
#       --run-name ablation_7b_ordinal
#
# The 7B cells use Qwen's own AWQ checkpoint, not the fp16 one -- see
# generator.py's VLLMGenerator docstring for why. Same weights, same
# instruction tune, 4-bit; record the exact identifier in the write-up since
# it differs from the 3B cell's.
#
# Then for each: python scripts/03_run_filters.py --config configs/ablation.yaml \
#       --run-name <same --run-name as above>
#
# The prompt hash changes automatically with id_style (the passage labels
# differ), so a run resumed after an interruption cannot mix composite and
# ordinal generations -- see 02_run_rag.py's cache-invalidation comment.

run_name: ablation_3b_ordinal   # overridden per invocation with --run-name

seed: 20260728

data:
  dataset: obliqa
  split: test
  raw_dir: data/raw/obliqa
  n_questions: 2000              # match the registered pilot for comparability

retrieval:
  top_k: 10
  bm25:
    k1: 1.2
    b: 0.75
  dense:
    model: BAAI/bge-base-en-v1.5
    batch_size: 64
    normalize: true
  fusion:
    method: rrf
    rrf_k: 60

generation:
  model: Qwen/Qwen2.5-3B-Instruct   # overridden per invocation with --model
  backend: vllm                     # cluster: 10x the Colab transformers path
  max_new_tokens: 256
  max_passage_chars: 4000
  max_total_prompt_chars: 32000
  temperature: 0.0
  seed: 20260728
  prompt_version: v1
  id_style: ordinal                 # overridden per invocation with --id-style

checks:
  schema:
    require_nonempty_citations: true
  faithfulness:
    entailment_threshold: 0.5
    contradiction_threshold: 0.5
  nli:
    model: microsoft/deberta-large-mnli
    batch_size: 32
  claim_decomposition:
    backend: llm
    prompt_version: v1
  attribution:
    jaccard_threshold: 0.0

sampling:
  allocation:
    candidate_recoverable: 80
    candidate_unrecoverable: 20
    control: 50
  n_double_annotated: 50

analysis:
  bootstrap_resamples: 10000
  confidence_level: 0.95

paths:
  index_dir: data/index
  interim_dir: data/interim
  annotation_dir: data/annotation
  runs_dir: runs
