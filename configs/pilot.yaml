# Registered pilot configuration.
# Values marked [REGISTERED] are fixed by docs/PREREGISTRATION.md and must not be
# changed after 02_run_rag.py has been run. Changing them requires a deviation
# entry in Section 11 of the pre-registration.

run_name: pilot_v1

seed: 20260728                    # [REGISTERED] global seed

data:
  dataset: obliqa
  split: test
  raw_dir: data/raw/obliqa
  # Number of questions to run. [REGISTERED] 2000, or the whole split if smaller.
  n_questions: 2000

retrieval:
  top_k: 10                       # [REGISTERED]
  bm25:
    k1: 1.2
    b: 0.75
  dense:
    # Any sentence-transformers model. Chosen for CPU-viability + quality.
    model: BAAI/bge-base-en-v1.5
    batch_size: 64
    normalize: true
  fusion:
    method: rrf                   # reciprocal rank fusion
    rrf_k: 60

generation:
  # MUST be a different model family from checks.nli.model. See pre-registration S5.
  # Pick by VRAM -- run `python scripts/02_run_rag.py --preflight` to check:
  #   >=14 GB  Qwen/Qwen2.5-7B-Instruct
  #    8-14 GB Qwen/Qwen2.5-3B-Instruct
  #    <8 GB   Qwen/Qwen2.5-1.5B-Instruct
  # Whichever you use goes in the provenance header; record it in the write-up.
  model: Qwen/Qwen2.5-7B-Instruct
  backend: hf                     # vllm (Linux+CUDA) | hf (anywhere) | stub
  max_new_tokens: 256            # the target JSON is small; 512 just burns time
  # Prompt length caps. The ADGM corpus contains a 152,000-char "passage" (the
  # defined-terms glossary) against a median of 262, which alone produces a
  # ~38k-token prompt that will not fit on a 16 GB card. No ObliQA question has a
  # passage over 8k chars in its gold set, so capping cannot break answerability.
  # Changing either value invalidates cached generations automatically.
  max_passage_chars: 4000
  max_total_prompt_chars: 32000
  temperature: 0.0                # [REGISTERED] deterministic
  seed: 20260728
  prompt_version: v1              # prompts/answer_v1.txt

checks:
  # S1 -- schema validity
  schema:
    require_nonempty_citations: true   # [REGISTERED]

  # S2 -- faithfulness
  faithfulness:
    entailment_threshold: 0.5          # [REGISTERED] do not tune
    contradiction_threshold: 0.5       # [REGISTERED] do not tune
  nli:
    model: microsoft/deberta-large-mnli
    batch_size: 32
  claim_decomposition:
    backend: llm                       # llm | rule
    prompt_version: v1

  # S3 -- attribution screen (sampling device, NOT a criterion)
  attribution:
    jaccard_threshold: 0.0             # [REGISTERED] 0 overlap -> candidate pool

sampling:
  # [REGISTERED, amended 2026-07-28 -- see PREREGISTRATION.md Section 11]
  # Three strata. The candidate pool is split by whether a gold passage was in
  # the retrieved context: if it was not, the model could not have cited
  # correctly and the item is a retrieval failure by construction.
  allocation:
    candidate_recoverable: 80
    candidate_unrecoverable: 20
    control: 50
  n_double_annotated: 50          # [REGISTERED]

analysis:
  bootstrap_resamples: 10000      # [REGISTERED]
  confidence_level: 0.95          # [REGISTERED]

paths:
  index_dir: data/index
  interim_dir: data/interim
  annotation_dir: data/annotation
  runs_dir: runs
