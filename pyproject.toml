[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saferag"
version = "0.1.0"
description = "Schema-grounded, faithfulness-aware self-correction for retrieval-augmented generation in financial compliance QA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adnan Mashrur Sadad" }]

# Core dependencies only. Everything here installs on CPU and on Windows.
# Heavy / platform-specific extras live in the optional groups below.
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "rank-bm25>=0.2.2",
    "orjson>=3.9",
]

[project.optional-dependencies]
# Dense retrieval + NLI. CPU-capable, GPU if torch finds one.
models = [
    "torch>=2.2",
    "sentence-transformers>=2.7",
    "transformers>=4.40",
    # Required by device_map="auto" in HFGenerator. Without it transformers
    # raises at load time, not at install time, which is a nasty place to find out.
    "accelerate>=0.30",
]
# Fast batched local generation. Linux/GPU only -- do NOT install on Windows.
serve = [
    "vllm>=0.4.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
saferag-annotate = "saferag.pilot.annotate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
